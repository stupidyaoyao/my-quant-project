name: News Driven Candidate Scanner

on:
  schedule:
    # UTC 12:00，大約對應美東時間 8:00am（夏令時間）/ 7:00am（冬令時間），跟盤前掃描同時段
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas lxml requests

      - name: Run news driven scanner
        run: python news_driven_scanner.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news_driven_candidates.json
          git diff --cached --quiet || git commit -m "自動更新新聞選股候選"
          git push
